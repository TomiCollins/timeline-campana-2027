function normalizeText(value){return String(value??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim()}function normalizeArea(value){const text=String(value??"").trim().replace(/\s+/g," ");return AREA_ALIASES[text.toLowerCase()]||text}function mapPresentationCategory(workstream,topic){return TOPIC_CATEGORY_OVERRIDES[normalizeText(topic)]||WORKSTREAM_MAPPING[workstream]||"SIN CATEGORÍA"}function esc(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]))}function pillarById(id){return CONFIG.pillars.find(item=>item.id===id)||{id,color:"var(--muted)",icon:"layers",short:id}}

function pillarCell(pillar){return`<div class="pillar-cell" style="--pillar:${pillar.color}"><button type="button" class="pillar-select" data-pillar-select="${esc(pillar.id)}" aria-label="Ver detalle de ${esc(pillar.short)}"><span class="pillar-icon">${iconSvg(pillar.icon)}</span><strong>${esc(pillar.short)}</strong><small>Ver detalle →</small></button></div>`}

function renderOverview(){const root=document.getElementById("overview-rows");root.innerHTML=OVERVIEW_DATA.map(row=>{const pillar=pillarById(row.pillar);let content;if(row.campaign){const detail=`data-overview-detail="${esc(pillar.id)}"`;content=`<div class="campaign-track overview-track" style="--pillar:${pillar.color}"><div class="activity hero-label" style="--week-range:1/21">ARMADO DE CAMPAÑA <span>·</span> SOLUCIONES INTEGRADAS / PLANES &amp; PROGRAMAS</div><button class="activity phase-1" style="--week-range:1/8" ${detail}>ANÁLISIS Y DIAGNÓSTICO</button><button class="activity phase-2" style="--week-range:8/15" ${detail}>CONSTRUCCIÓN</button><button class="activity phase-3" style="--week-range:18/21" ${detail}>DEFINICIÓN &amp; APROBACIÓN</button><button class="activity input input-retro" style="--week-range:1/5" ${detail}>Retrospectiva</button><button class="activity input input-q1" style="--week-range:8/13" ${detail}>+ Planes Q1 CP</button><div class="activity milestone readiness" style="--week-range:21/23">${iconSvg("flag")}<span>Sistema Operativo<br>para lanzar</span></div></div>`}else if(row.events){content=`<div class="overview-track events-track" style="--pillar:${pillar.color}"><button class="activity event-item outline event-ctb" style="--week-range:18/19" data-overview-detail="${esc(pillar.id)}"><span>CTB</span></button><button class="activity event-item outline event-expo" style="--week-range:19/21" data-overview-detail="${esc(pillar.id)}"><span>EXPOAGRO<small>Por confirmar</small></span></button><button class="activity event-item outline event-nexo" style="--week-range:21/23" data-overview-detail="${esc(pillar.id)}"><span>NEXO<small>Por confirmar</small></span></button><button class="activity event-item outline event-foco" style="--week-range:23/25" data-overview-detail="${esc(pillar.id)}"><span>FOCO<small>Por confirmar</small></span></button><button class="activity event-item milestone event-launch" style="--week-range:23/25" data-overview-detail=" function parseAreas(value){const raw=String(value??"").trim().replace(/\s+/g," ");if(!raw)return[];const seen=new Set();return raw.split(" - ").map(normalizeArea).filter(item=>{const key=item.toLocaleLowerCase("es");if(!item||seen.has(key))return false;seen.add(key);return true})}function getAreas(){const areas=new Map();DETAIL_DATA.forEach(task=>[...parseAreas(task.responsibleArea),...parseAreas(task.dependencies)].forEach(area=>areas.set(area.toLocaleLowerCase("es"),area)));return[...areas.values()].sort((a,b)=>a.localeCompare(b,"es"))}function populateFilters(){const area=document.getElementById("area-filter");area.innerHTML='<option value="all">Todas las áreas</option>'+getAreas().map(value=>`<option value="${esc(value)}">${esc(value)}</option>`).join("");const pillar=document.getElementById("pillar-filter-detail");pillar.innerHTML='<option value="all">Todos</option>'+CONFIG.pillars.map(value=>`<option value="${esc(value.id)}">${esc(value.short)}</option>`).join("")}
function areaMatches(task){if(APP_STATE.area==="all")return true;const key=normalizeArea(APP_STATE.area).toLocaleLowerCase("es");return[...parseAreas(task.responsibleArea),...parseAreas(task.dependencies)].some(area=>area.toLocaleLowerCase("es")===key)}function filterTasks(){return DETAIL_DATA.filter(task=>(APP_STATE.pillar==="all"||task.presentationCategory===APP_STATE.pillar)&&areaMatches(task))}function groupTasks(tasks){const groups=new Map();for(const task of tasks){if(!groups.has(task.presentationCategory))groups.set(task.presentationCategory,[]);groups.get(task.presentationCategory).push(task)}return groups}
function renderTask(task,pillar){const areaValues=parseAreas(task.responsibleArea),dependencies=parseAreas(task.dependencies);let monthOffset=0;const cells=CONFIG.months.map(month=>{const firstWeek=monthOffset+1,lastWeek=monthOffset+month.weeks;monthOffset=lastWeek;const weeks=task.activeWeeks.filter(week=>week.month===month.id).map(week=>week.week-firstWeek+1);const unique=[...new Set(weeks)].sort((a,b)=>a-b);const segments=[];for(const week of unique){const previous=segments.at(-1);if(previous&&week===previous.end+1)previous.end=week;else segments.push({start:week,end:week})}return`<div class="month-cell" aria-label="${month.label}${unique.length?`: semanas ${unique.join(", ")}`:" sin actividad"}">${segments.length?segments.map(segment=>`<span class="month-track-fill is-active" style="--segment-left:${((segment.start-1)/month.weeks*100).toFixed(2)}%;--segment-width:${((segment.end-segment.start+1)/month.weeks*100).toFixed(2)}%;--pillar:${pillar.color}" title="${month.label} · semanas ${segment.start}${segment.end!==segment.start?`–${segment.end}`:""}"></span>`).join(""):""}</div>`}).join("");return`<div class="detail-row" style="--pillar:${pillar.color}"><div class="task-description"><button type="button" class="task-open" data-task-id="${esc(task.id)}">${esc(task.task)}</button>${task.topic&&normalizeText(task.topic)!==normalizeText(task.task)?`<small class="task-topic">${esc(task.topic)}</small>`:""}</div><div class="owner-area">${areaValues.length?`<strong>${esc(areaValues.join(" · "))}</strong>`:`<span class="empty-value">${task.fieldsAvailable.responsibleArea?"—":"Pendiente"}</span>`}</div><div class="dependencies-cell">${dependencies.length?`<strong>${esc(dependencies.join(" · "))}</strong>`:`<span class="empty-value">${task.fieldsAvailable.dependencies?"—":"Pendiente"}</span>`}</div>${cells}</div>`}
function renderDetail(){const tasks=filterTasks(),groups=groupTasks(tasks),root=document.getElementById("detail-rows");root.innerHTML=CONFIG.pillars.map(pillar=>{const items=groups.get(pillar.id)||[];if(!items.length)return"";return`<section class="pillar-section" style="--pillar:${pillar.color}"><div class="pillar-title">${iconSvg(pillar.icon)}${esc(pillar.short)}</div>${items.map(task=>renderTask(task,pillar)).join("")}</section>`}).join("");const uncategorized=groups.get("SIN CATEGORÍA")||[];if(uncategorized.length)root.insertAdjacentHTML("beforeend",`<section class="pillar-section" style="--pillar:var(--muted)"><div class="pillar-title">SIN CATEGORÍA</div>${uncategorized.map(task=>renderTask(task,pillarById("SIN CATEGORÍA"))).join("")}</section>`);document.getElementById("context-sentence").textContent=APP_STATE.area==="all"?`${tasks.length} actividades`:`${tasks.length} actividades · Área: ${APP_STATE.area}`;document.querySelectorAll("[data-task-id]").forEach(button=>button.addEventListener("click",()=>openDrawer(button.dataset.taskId)))}
function showValue(value){if(value==="—")return value;return value!==null&&value!==undefined&&String(value).trim()!==""?String(value):"Pendiente"}function openDrawer(id){const task=DETAIL_DATA.find(item=>item.id===id);if(!task)return;lastFocused=document.activeElement;document.getElementById("drawer-title").textContent=task.task||"Detalle de la actividad";document.getElementById("drawer-subtitle").textContent=`${task.presentationCategory} · ${task.topic}`;const fields=[["Actividad",task.task],["Tema",task.topic],["Workstream original",task.workstreamOriginal],["Pilar",task.presentationCategory],["Área Responsable",task.responsibleArea|| (task.fieldsAvailable.responsibleArea?"—":"Pendiente")],["Dependencias",task.dependencies|| (task.fieldsAvailable.dependencies?"—":"Pendiente")],["Calendarización",task.activeWeeks.length?task.activeWeeks.map(week=>`${week.month||"Mes pendiente"} · semana ${week.week}`).join("; "):"Sin calendarizar"]];document.getElementById("drawer-body").innerHTML=fields.map(([label,value])=>`<section class="drawer-section"><h3>${esc(label)}</h3><div class="drawer-value ${!value?"pending":""}">${esc(showValue(value))}</div></section>`).join("");document.getElementById("drawer").classList.add("is-open");document.getElementById("drawer").setAttribute("aria-hidden","false");document.getElementById("scrim").classList.add("is-open");document.getElementById("scrim").setAttribute("aria-hidden","false");document.querySelector('[data-action="close-drawer"]').focus()}function closeDrawer(){document.getElementById("drawer").classList.remove("is-open");document.getElementById("drawer").setAttribute("aria-hidden","true");document.getElementById("scrim").classList.remove("is-open");document.getElementById("scrim").setAttribute("aria-hidden","true");if(lastFocused?.focus)lastFocused.focus()}

function setTheme(theme){APP_STATE.theme=theme;document.body.dataset.theme=theme;localStorage.setItem("campaign-theme-2027",theme);document.querySelectorAll("[data-theme-choice]").forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.themeChoice===theme)))}function setActiveTab(tab){APP_STATE.tab=tab;document.querySelectorAll("[data-tab]").forEach(button=>button.setAttribute("aria-selected",String(button.dataset.tab===tab)));document.querySelectorAll(".view").forEach(view=>{const active=view.id===(tab==="overview"?"overview-view":"detail-view");view.classList.toggle("is-active",active);view.setAttribute("aria-hidden",String(!active))});if(tab==="detail")renderDetail();window.scrollTo({top:0,behavior:"smooth"})}function openDetailFromOverview(pillar="all"){APP_STATE.pillar=pillar;document.getElementById("pillar-filter-detail").value=pillar;setActiveTab("detail")}function clearFilters(){APP_STATE.area="all";APP_STATE.pillar="all";document.getElementById("area-filter").value="all";document.getElementById("pillar-filter-detail").value="all";renderDetail()}async function toggleFullscreen(){try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();document.body.classList.add("present-dim");clearTimeout(presentationTimer);presentationTimer=setTimeout(()=>document.body.classList.add("present-dim"),3000)}else await document.exitFullscreen()}catch(error){console.warn("Fullscreen no disponible",error)}}
function bindEvents(){document.addEventListener("click",event=>{const tab=event.target.closest("[data-tab]");if(tab){setActiveTab(tab.dataset.tab);return}const theme=event.target.closest("[data-theme-choice]");if(theme){setTheme(theme.dataset.themeChoice);return}const action=event.target.closest("[data-action]")?.dataset.action;if(action==="back"){setActiveTab("overview");return}if(action==="clear"){clearFilters();return}if(action==="present"){toggleFullscreen();return}if(action==="close-drawer"){closeDrawer();return}const pillar=event.target.closest("[data-pillar-select]");if(pillar){openDetailFromOverview(pillar.dataset.pillarSelect);return}const activity=event.target.closest("[data-overview-detail]");if(activity){openDetailFromOverview(activity.dataset.overviewDetail);return}});document.getElementById("area-filter").addEventListener("change",event=>{APP_STATE.area=event.target.value;renderDetail()});document.getElementById("pillar-filter-detail").addEventListener("change",event=>{APP_STATE.pillar=event.target.value;renderDetail()});document.getElementById("scrim").addEventListener("click",closeDrawer);document.addEventListener("keydown",event=>{if(event.key==="Escape"&&document.getElementById("drawer").classList.contains("is-open")){closeDrawer();return}if(event.key==="Escape"&&document.fullscreenElement)document.exitFullscreen()});document.addEventListener("mousemove",()=>{if(document.fullscreenElement){document.body.classList.remove("present-dim");clearTimeout(presentationTimer);presentationTimer=setTimeout(()=>document.body.classList.add("present-dim"),3000)}});document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement)document.body.classList.remove("present-dim")})}
function qualityStats(){const general=DETAIL_DATA.filter(task=>task.sourceRow),calendarized=general.filter(task=>task.scheduled),fills=[...new Set(general.flatMap(task=>task.activeWeeks.map(week=>week.fill)))],workstreams=[...new Set(general.map(task=>task.workstreamOriginal))].sort((a,b)=>a.localeCompare(b,"es")),areas=[...new Set(general.flatMap(task=>parseAreas(task.responsibleArea)))].sort((a,b)=>a.localeCompare(b,"es")),dependencies=[...new Set(general.flatMap(task=>parseAreas(task.dependencies)))].sort((a,b)=>a.localeCompare(b,"es")),examples=calendarized.slice(0,5).map(task=>({activity:task.task,weeks:task.activeWeeks.map(week=>week.sourceCell),months:[...new Set(task.activeWeeks.map(week=>week.month).filter(Boolean))]}));return{file:"Timeline Principales 2027.xlsx",activities:general.length,workstreams,areas,dependencies,calendarized:calendarized.length,withoutCalendarization:general.length-calendarized.length,weeklyCellsAnalyzed:general.length*23,paintedCells:general.reduce((sum,task)=>sum+task.activeWeeks.length,0),fillStyles:fills,noArea:general.filter(task=>!task.responsibleArea).length,noDependencies:general.filter(task=>!task.dependencies).length,monthLabels:CONFIG.months.map(month=>month.label),examples,areaParser:{"Producto - Carbono - Comercial":parseAreas("Producto - Carbono - Comercial"),"SAP - Datos - Pricing":parseAreas("SAP - Datos - Pricing"),"P&C - Finanzas":parseAreas("P&C - Finanzas"),"GTM & CI":parseAreas("GTM & CI")}}}function renderQuality(){const qa=qualityStats();console.info("EXCEL CALENDAR QA",JSON.stringify(qa,null,2));console.assert(JSON.stringify(qa.areaParser["Producto - Carbono - Comercial"])===JSON.stringify(["Producto","Carbono","Comercial"]),"parseAreas: Producto - Carbono - Comercial");console.assert(JSON.stringify(qa.areaParser["SAP - Datos - Pricing"])===JSON.stringify(["SAP","Datos","Pricing"]),"parseAreas: SAP - Datos - Pricing");console.assert(JSON.stringify(qa.areaParser["P&C - Finanzas"])===JSON.stringify(["P&C","Finanzas"]),"parseAreas: P&C - Finanzas");console.assert(JSON.stringify(qa.areaParser["GTM & CI"])===JSON.stringify(["GTM & CI"]),"parseAreas: GTM & CI");if(DETAIL_DATA.some(task=>task.presentationCategory==="SIN CATEGORÍA"))console.warn("Registros sin categoría de presentación",DETAIL_DATA.filter(task=>task.presentationCategory==="SIN CATEGORÍA").map(task=>({workstream:task.workstreamOriginal,topic:task.topic})))}
function renderAll(){renderMonthHeaders();renderOverview();if(APP_STATE.tab==="detail")renderDetail()}

let AREA_OPTIONS=[];APP_STATE.areas=[];
function parseRawAreas(value){return String(value??"").trim().replace(/\s+/g," ").split(" - ").map(area=>area.trim()).filter(Boolean)}
function applyPresentationOverrides(){DETAIL_DATA.forEach(task=>{const category=TOPIC_CATEGORY_OVERRIDES[normalizeText(task.topic)];if(category)task.presentationCategory=category})}
function expandCompositeAreas(areas){return areas.flatMap(area=>AREA_COMPOSITES[area.toLocaleLowerCase("es")]||[area])}
function normalizeAreaAliases(areas){return areas.map(area=>{const value=String(area??"").trim();return AREA_ALIASES[value.toLocaleLowerCase("es")]||value})}
function dedupeAreas(areas){const seen=new Set();return areas.filter(area=>{const value=String(area??"").trim(),key=value.toLocaleLowerCase("es");if(!value||seen.has(key))return false;seen.add(key);return true})}
function parseAndNormalizeAreas(value){return dedupeAreas(normalizeAreaAliases(expandCompositeAreas(parseRawAreas(value))))}
function parseAreas(value){return parseAndNormalizeAreas(value)}
function normalizeArea(value){return parseAndNormalizeAreas(value)[0]||""}
function getAreas(){return dedupeAreas(DETAIL_DATA.flatMap(task=>[...parseAndNormalizeAreas(task.responsibleArea),...parseAndNormalizeAreas(task.dependencies)])).sort((a,b)=>a.localeCompare(b,"es"))}
function populateFilters(){AREA_OPTIONS=getAreas();const area=document.getElementById("area-filter");area.innerHTML=AREA_OPTIONS.map(value=>`<option value="${esc(value)}">${esc(value)}</option>`).join("");const list=document.getElementById("area-options");list.innerHTML=AREA_OPTIONS.map(value=>`<button type="button" class="area-option" role="option" aria-selected="false" data-area-option="${esc(value)}">${esc(value)}</button>`).join("");const pillar=document.getElementById("pillar-filter-detail");pillar.innerHTML='<option value="all">Todos</option>'+CONFIG.pillars.map(value=>`<option value="${esc(value.id)}">${esc(value.short)}</option>`).join("");updateAreaTrigger()}
function areaMatches(task){if(!APP_STATE.areas.length)return true;const values=[...parseAndNormalizeAreas(task.responsibleArea),...parseAndNormalizeAreas(task.dependencies)].map(area=>area.toLocaleLowerCase("es"));return APP_STATE.areas.some(area=>values.includes(area.toLocaleLowerCase("es")))}
function filterTasks(){return DETAIL_DATA.filter(task=>(APP_STATE.pillar==="all"||task.presentationCategory===APP_STATE.pillar)&&areaMatches(task))}
function updateAreaTrigger(){const labels=APP_STATE.areas;if(!labels.length){document.getElementById("area-trigger").textContent="Todas las áreas";return}const first=labels.slice(0,2).join(" + ");document.getElementById("area-trigger").textContent=labels.length<3?first:`${first} +${labels.length-2}`}
function updateAreaOptions(){document.querySelectorAll("[data-area-option]").forEach(option=>option.setAttribute("aria-selected",String(APP_STATE.areas.includes(option.dataset.areaOption))))}
function closeAreaOptions(returnFocus=false){const trigger=document.getElementById("area-trigger"),list=document.getElementById("area-options");list.hidden=true;trigger.setAttribute("aria-expanded","false");if(returnFocus)trigger.focus()}
function bindAreaMultiSelect(){const trigger=document.getElementById("area-trigger"),list=document.getElementById("area-options"),root=document.querySelector(".area-multiselect");trigger.addEventListener("click",()=>{const open=trigger.getAttribute("aria-expanded")==="true";list.hidden=open;trigger.setAttribute("aria-expanded",String(!open))});list.addEventListener("click",event=>{const option=event.target.closest("[data-area-option]");if(!option)return;const area=option.dataset.areaOption,key=area.toLocaleLowerCase("es"),selected=APP_STATE.areas.some(item=>item.toLocaleLowerCase("es")==key);APP_STATE.areas=selected?APP_STATE.areas.filter(item=>item.toLocaleLowerCase("es")!==key):[...APP_STATE.areas,area];document.querySelectorAll("#area-filter option").forEach(item=>item.selected=APP_STATE.areas.includes(item.value));updateAreaOptions();updateAreaTrigger();renderDetail()});document.addEventListener("click",event=>{if(!root.contains(event.target))closeAreaOptions()});document.addEventListener("keydown",event=>{if(event.key==="Escape"&&!list.hidden)closeAreaOptions(true)})}
function clearFilters(){APP_STATE.area="all";APP_STATE.areas=[];APP_STATE.pillar="all";document.getElementById("area-filter").selectedIndex=-1;document.getElementById("pillar-filter-detail").value="all";updateAreaOptions();updateAreaTrigger();closeAreaOptions();renderDetail()}
function renderQuality(){const qa=qualityStats();console.info("EXCEL CALENDAR QA",JSON.stringify(qa,null,2));const expected={"Digital":["Datos"],"Planning":["Supply"],"GTM & CI":["GTM","CI"],"Producto - Carbono - Comercial":["Producto","Carbono","Comercial"],"GTM & CI - Planning - Digital":["GTM","CI","Supply","Datos"]};Object.entries(expected).forEach(([value,areas])=>console.assert(JSON.stringify(parseAndNormalizeAreas(value))===JSON.stringify(areas),`area normalization: ${value}`));console.assert(!AREA_OPTIONS.includes("Digital")&&!AREA_OPTIONS.includes("Planning")&&!AREA_OPTIONS.includes("GTM & CI"),"Area catalog contains only canonical/composite-expanded entries");console.assert(DETAIL_DATA.length===106,"Current Excel detail row count");if(DETAIL_DATA.some(task=>task.presentationCategory==="SIN CATEGORÍA"))console.warn("Registros sin categoría de presentación",DETAIL_DATA.filter(task=>task.presentationCategory==="SIN CATEGORÍA").length)}
function renderDetail(){const tasks=filterTasks(),groups=groupTasks(tasks),root=document.getElementById("detail-rows");root.innerHTML=CONFIG.pillars.map(pillar=>{const items=groups.get(pillar.id)||[];if(!items.length)return"";return`<section class="pillar-section" style="--pillar:${pillar.color}"><div class="pillar-title">${iconSvg(pillar.icon)}${esc(pillar.short)}</div>${items.map(task=>renderTask(task,pillar)).join("")}</section>`}).join("");const uncategorized=groups.get("SIN CATEGORÍA")||[];if(uncategorized.length)root.insertAdjacentHTML("beforeend",`<section class="pillar-section" style="--pillar:var(--muted)"><div class="pillar-title">SIN CATEGORÍA</div>${uncategorized.map(task=>renderTask(task,pillarById("SIN CATEGORÍA"))).join("")}</section>`);const selected=APP_STATE.areas.length?` · Área: ${APP_STATE.areas.join(" + ")}`:"";document.getElementById("context-sentence").textContent=`${tasks.length} actividades${selected}`;document.querySelectorAll("[data-task-id]").forEach(button=>button.addEventListener("click",()=>openDrawer(button.dataset.taskId)))}
function openDrawer(id){const task=DETAIL_DATA.find(item=>item.id===id);if(!task)return;lastFocused=document.activeElement;document.getElementById("drawer-title").textContent=task.task||"Detalle de la actividad";document.getElementById("drawer-subtitle").textContent=`${task.presentationCategory} · ${task.topic}`;const fields=[["Actividad",task.task],["Tema",task.topic],["Workstream original",task.workstreamOriginal],["Pilar",task.presentationCategory],["Área Responsable",parseAndNormalizeAreas(task.responsibleArea).join(" · ")|| (task.fieldsAvailable.responsibleArea?"—":"Pendiente")],["Dependencias",parseAndNormalizeAreas(task.dependencies).join(" · ")|| (task.fieldsAvailable.dependencies?"—":"Pendiente")],["Calendarización",task.activeWeeks.length?task.activeWeeks.map(week=>`${week.month||"Mes pendiente"} · semana ${week.week}`).join("; "):"Sin calendarizar"]];document.getElementById("drawer-body").innerHTML=fields.map(([label,value])=>`<section class="drawer-section"><h3>${esc(label)}</h3><div class="drawer-value ${!value?"pending":""}">${esc(showValue(value))}</div></section>`).join("");document.getElementById("drawer").classList.add("is-open");document.getElementById("drawer").setAttribute("aria-hidden","false");document.getElementById("scrim").classList.add("is-open");document.getElementById("scrim").setAttribute("aria-hidden","false");document.querySelector('[data-action="close-drawer"]').focus()}

async function init(){applyPresentationOverrides();populateFilters();setTheme(APP_STATE.theme);renderQuality();bindEvents();bindAreaMultiSelect();renderAll()}init().catch(error=>{console.error("No se pudo cargar el dataset embebido",error);document.getElementById("detail-rows").innerHTML='<div class="empty-state">No fue posible leer los datos integrados.</div>'});
</script>
